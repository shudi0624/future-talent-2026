const grid=document.getElementById('grid');
const detail=document.getElementById('detail');
function drawGrid(){
  DATA.forEach((item,idx)=>{
    const s=styleMap[idx];
    const wrap=document.createElement('div');
    wrap.className='item pos'+(idx+1);
    wrap.innerHTML=`<button type="button" class="bubble" style="--ring:${s.ring}" aria-label="${item.name}"><div class="icon">${svgIcon(s.icon,s.ink,s.accent)}</div></button><div class="label" style="color:${s.ring}">${item.name}</div>`;
    wrap.querySelector('.bubble').addEventListener('click',()=>openDetail(idx));
    grid.appendChild(wrap);
  });
}
function openDetail(idx){
  document.querySelectorAll('.bubble').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const t=DATA[idx];
  detail.classList.add('show');
  document.getElementById('counter').textContent=`未來人才 ${String(idx+1).padStart(2,'0')} / 10`;
  document.getElementById('talentTitle').textContent=t.name;
  document.getElementById('talentHeadline').textContent=t.headline;
  document.getElementById('talentScene').textContent=t.scenario;
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  t.sectors.forEach((sector,sidx)=>{
    const btn=document.createElement('button');
    btn.type='button'; btn.className='tab'+(sidx===0?' active':''); btn.textContent=sector.name;
    btn.addEventListener('click',()=>renderSector(t,sidx)); tabs.appendChild(btn);
  });
  renderSector(t,0);
  detail.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderSector(item,sidx){
  document.querySelectorAll('#tabs .tab').forEach((el,i)=>el.classList.toggle('active',i===sidx));
  const s=item.sectors[sidx];
  document.getElementById('industryPanel').innerHTML=`<div class="industryTitle">產業 ${s.id}｜${s.name}</div><div class="jobs">${s.jobs.map(job=>`<article class="job"><div class="jobTitle">職務 ${job.id}｜${job.name}</div><div class="jobDesc">${job.description||''}</div><div class="jobMajor">${job.majors ? '相關科系／'+job.majors : ''}</div></article>`).join('')}</div>`;
}
document.getElementById('closeBtn').addEventListener('click',()=>{detail.classList.remove('show');document.querySelectorAll('.bubble').forEach(el=>el.classList.remove('active'));});
drawGrid();
new ResizeObserver(()=>{const h=document.getElementById('talentMap').getBoundingClientRect().height;window.parent?.postMessage({type:'future-talent-v4-resize',height:h},'*');}).observe(document.getElementById('talentMap'));
</script>
